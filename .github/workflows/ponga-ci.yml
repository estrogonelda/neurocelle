name: ponga CI/CD

on:
  push:
    paths: ["ponga/**", ".github/workflows/ponga-ci.yml"]
  pull_request:
    paths: ["ponga/**", ".github/workflows/ponga-ci.yml"]
  workflow_dispatch:

concurrency:
  group: ponga-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ponga

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install ruff==0.8.4
      - run: ruff check backend frontend e2e
      - run: ruff format --check backend frontend e2e
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ponga/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ponga/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: >
          python -m pytest tests/unit --cov=app --cov-report=term-missing
          --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.service }}
          path: |
            ponga/${{ matrix.service }}/coverage.xml
            ponga/${{ matrix.service }}/junit.xml

  integration:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ponga_app:ponga_app_pw@localhost:5432/ponga
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://ponga_owner:ponga_owner_pw@localhost:5432/ponga
      TEST_READONLY_DATABASE_URL: postgresql+psycopg://ponga_readonly:ponga_readonly_pw@localhost:5432/ponga
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ponga/backend/requirements*.txt
      - name: Start PostgreSQL (same image + init scripts as production)
        run: docker compose up -d --wait db
      - run: pip install -r backend/requirements-dev.txt
      - name: Integration tests
        working-directory: ponga/backend
        run: python -m pytest tests/integration -v --junitxml=junit.xml
      - name: Database logs
        if: failure()
        run: docker compose logs db

  e2e:
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Populate and verify the database
        run: scripts/populate_and_test_db.sh --reset
      - name: End-to-end tests (Playwright)
        run: docker compose --profile e2e run --rm --build e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: ponga/e2e/artifacts
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose --profile e2e down -v

  deliver:
    # CD: publish images to GHCR for the default branch and version tags.
    needs: e2e
    if: >
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ponga-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ponga/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
